name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate from source so CI proves the committed HTML matches the data.
      # Regenerate from source so CI proves the committed HTML matches the data.
      # Order matters: the Counterwise build owns the shared publication files
      # (index.html, 404.html, robots.txt, sitemap.xml, feed.xml); the Crisp Kitchen
      # register build owns only its own trees and never writes those five.
      - name: Generate site
        run: |
          node _build/build.mjs
          node _build/make-images.mjs
          node tools/build.cjs
          node tools/noindex.cjs

      - name: Fail if generated output differs from what is committed
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Committed HTML is out of date with _build/. Run 'npm run build' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Verify content rules (R1-R9)
        run: node tools/verify.mjs

      - name: Publication gate for the register build
        run: node tools/check.cjs

      - name: Link check and XML validation
        run: node tools/linkcheck.mjs

      - name: Register-surface publish gate (session b26a9f95 pages)
        run: python3 scripts/publish_gate.py

      # Prove the site works at the real project path (/WinB/), not just on disk.
      - name: Serve at the project path and smoke-test every URL
        run: |
          mkdir -p _serve/WinB
          rsync -a --exclude _serve --exclude _build --exclude .git ./ _serve/WinB/
          (cd _serve && python3 -m http.server 3001 &) ; sleep 2
          BASE=http://localhost:3001/WinB node tools/smoke.mjs

      - name: Upload Pages artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
