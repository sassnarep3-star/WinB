name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publishing gate (disclosure, sponsored links, tags, links, sitemap, feed, robots)
        run: python3 scripts/check_site.py
      - name: Validate site files
        run: |
          test -f index.html
          test -f styles.css
          test -f sitemap.xml
          test -f feed.xml
          test -f robots.txt
          for file in products/index.html products/air-fryers/index.html products/thermometers/index.html guides/index.html guides/basket-or-oven.html guides/capacity-checklist.html guides/cleanup-counter.html guides/multifunction.html review/index.html direction/index.html flags/index.html analytics/index.html assets/config.js assets/analytics.js; do test -f "$file"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
