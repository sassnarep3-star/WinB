name: site-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild site from data/
        run: python3 scripts/build_site.py
      - name: Fail if committed register/ or sitemap.xml is stale
        run: git diff --exit-code -- register/ sitemap.xml robots.txt
      - name: Run data and site checks
        run: python3 scripts/check_site.py
